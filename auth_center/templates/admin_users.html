<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <title>用户管理 - SSO 认证中心</title>
    <link rel="stylesheet" href="/static/css/modern.css" />
    <script src="/static/js/lucide.js"></script>
    <style>
        /* 用户管理专用样式 */
        .user-management-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .action-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        /* 优化表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 14px;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .data-table th,
        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .data-table th {
            background: rgba(0, 212, 255, 0.05);
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table tbody tr {
            transition: background-color var(--transition-fast);
        }

        .data-table tbody tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            margin-right: 8px;
        }

        /* 优化模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            margin: auto;
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.3);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .close {
            color: var(--text-secondary);
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            transition: all 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close:hover {
            color: var(--danger-color);
            background-color: rgba(255, 51, 51, 0.1);
            transform: rotate(90deg);
        }

        /* 优化表单样式 */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group-inline {
            display: flex;
            gap: 16px;
        }

        .form-group-inline > div {
            flex: 1;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.938rem;
            transition: all var(--transition-fast);
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
            background-color: rgba(0, 212, 255, 0.05);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: rgba(37, 45, 71, 0.5);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-hint {
            display: block;
            margin-top: 0.375rem;
            font-size: 0.813rem;
            color: var(--text-tertiary);
        }

        .form-error {
            color: var(--danger-color);
            font-size: 0.813rem;
            margin-top: 0.5rem;
            padding: 0.75rem;
            background-color: rgba(255, 51, 51, 0.1);
            border: 1px solid var(--danger-color);
            border-radius: var(--radius-md);
        }

        .form-error:empty {
            display: none;
        }

        /* 文件上传区域 */
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 32px;
            text-align: center;
            margin: 16px 0;
            cursor: pointer;
            transition: all 0.2s;
            background-color: var(--bg-tertiary);
        }

        .file-upload-area:hover {
            border-color: var(--primary-color);
            background: rgba(0, 212, 255, 0.05);
        }

        .file-info {
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 自定义滚动条 */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        @media (max-width: 768px) {
            .form-group-inline {
                flex-direction: column;
                gap: 0;
            }

            .modal-content {
                padding: 20px;
                width: 95%;
            }

            .data-table {
                font-size: 0.813rem;
            }

            .data-table th,
            .data-table td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/admin" class="navbar-brand">🔑 管理控制台</a>
            <div class="navbar-menu">
                <a href="/account" class="navbar-link">账户管理</a>
                <a href="/logout" class="navbar-link">退出</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="user-management-container">
            <div class="card">
                <h1 class="card-title">用户管理</h1>
                <p class="card-subtitle">管理系统用户,包括添加、编辑和批量导入。</p>

                <div class="action-bar">
                    <button class="btn btn-primary" onclick="openAddUserModal()">➕ 添加用户</button>
                    <button class="btn btn-secondary" onclick="openImportUsersModal()">📄 批量导入</button>
                </div>

                <div id="usersListContainer">
                    <p class="text-secondary">加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑用户模态框 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="userModalTitle">添加用户</h2>
                <span class="close" onclick="closeUserModal()">&times;</span>
            </div>
            <form id="userForm" onsubmit="handleUserSubmit(event)">
                <input type="hidden" id="user_id" name="user_id">
                <div class="form-group">
                    <label class="form-label" for="user_email">邮箱 (必填)</label>
                    <input type="email" id="user_email" name="email" class="form-input" required>
                </div>
                <div class="form-group-inline">
                    <div class="form-group">
                        <label class="form-label" for="user_name">姓名 (必填)</label>
                        <input type="text" id="user_name" name="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="user_username">用户名 (可选)</label>
                        <input type="text" id="user_username" name="username" class="form-input">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="user_password">密码 (留空则不修改)</label>
                    <input type="password" id="user_password" name="password" class="form-input" minlength="8">
                    <div class="form-hint" id="password_hint"></div>
                </div>

                <div id="customFieldsArea"></div>

                <div id="userFormError" class="form-error"></div>
                <div class="mt-3 flex gap-2">
                    <button type="submit" id="userFormBtn" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="closeUserModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 批量导入用户模态框 -->
    <div id="importUsersModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">批量导入用户</h2>
                <span class="close" onclick="closeImportUsersModal()">&times;</span>
            </div>
            <div class="form-group">
                <label class="form-label">选择文件</label>
                <div class="file-upload-area" id="userFileUploadArea" onclick="document.getElementById('userFileInput').click()">
                    <div style="font-size: 48px; margin-bottom: 12px;">📄</div>
                    <div>点击选择文件或拖拽文件到此处</div>
                    <div style="font-size: 13px; color: var(--text-secondary); margin-top: 8px;">
                        支持 .csv, .txt 格式<br>
                        CSV/TXT 格式: email,username,password,name
                    </div>
                </div>
                <input type="file" id="userFileInput" accept=".txt,.csv" style="display: none;" onchange="handleUserFileSelect(event)">
                <div id="userFileInfo" class="file-info"></div>
            </div>
            <div id="importUsersError" class="form-error"></div>
            <div id="importUsersResult" class="result-box" style="display: none;"></div>
            <div class="mt-3 flex gap-2">
                <button id="importUsersBtn" class="btn btn-primary" onclick="handleImportUsers()" disabled>导入</button>
                <button type="button" class="btn btn-secondary" onclick="closeImportUsersModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        let allUsers = [];
        let customFields = [];
        let isEditMode = false;

        function escapeHtml(str) {
            return String(str === undefined || str === null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function safeApiRequest(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                credentials: 'include'
            });

            if (!response.ok) {
                const errorText = await response.text();
                let errorMessage;
                try {
                    const errorData = JSON.parse(errorText);
                    errorMessage = errorData.detail || errorData.message || `请求失败 (${response.status})`;
                } catch {
                    errorMessage = `请求失败 (${response.status}): ${errorText.substring(0, 100)}`;
                }
                throw new Error(errorMessage);
            }

            const responseText = await response.text();
            try {
                return JSON.parse(responseText);
            } catch {
                throw new Error(`服务器返回非 JSON 响应: ${responseText.substring(0, 100)}`);
            }
        }

        async function loadData() {
            try {
                const [usersData, fieldsData] = await Promise.all([
                    safeApiRequest('/api/admin/users'),
                    safeApiRequest('/api/admin/fields')
                ]);
                allUsers = usersData;
                customFields = fieldsData;
                renderUsersList();
            } catch (error) {
                document.getElementById('usersListContainer').innerHTML =
                    `<p class="form-error">加载数据失败: ${escapeHtml(error.message)}</p>`;
            }
        }

        function renderUsersList() {
            const container = document.getElementById('usersListContainer');
            if (allUsers.length === 0) {
                container.innerHTML = '<p class="text-secondary">当前没有用户。</p>';
                return;
            }

            let html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">ID</th>
                            <th>邮箱</th>
                            <th>姓名</th>
                            <th>用户名</th>
                            <th>创建时间</th>
                            <th style="width: 150px;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            allUsers.forEach(user => {
                const createdAt = user.created_at ? new Date(user.created_at).toLocaleDateString() : '-';
                html += `
                    <tr>
                        <td>${escapeHtml(user.id)}</td>
                        <td>${escapeHtml(user.email)}</td>
                        <td>${escapeHtml(user.name)}</td>
                        <td>${escapeHtml(user.username || '-')}</td>
                        <td>${createdAt}</td>
                        <td class="flex gap-1">
                            <button class="btn btn-sm btn-primary" onclick="openEditUserModal(${user.id})">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id}, '${escapeHtml(user.email).replace(/'/g, "\\'")}')">删除</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderCustomFieldsForm(userData = {}) {
            const area = document.getElementById('customFieldsArea');
            area.innerHTML = '';

            customFields.forEach(field => {
                if (!field.show_in_profile) return;

                const value = userData[field.field_key] || '';
                const required = field.is_required ? 'required' : '';
                const requiredLabel = field.is_required ? '<span style="color: var(--danger-color);">*</span>' : '';

                let inputHtml = '';

                switch (field.field_type) {
                    case 'textarea':
                        inputHtml = `<textarea id="custom_${field.field_key}" name="${field.field_key}" class="form-textarea" ${required}>${escapeHtml(value)}</textarea>`;
                        break;
                    default:
                        inputHtml = `<input type="${field.field_type}" id="custom_${field.field_key}" name="${field.field_key}" class="form-input" value="${escapeHtml(value)}" ${required}>`;
                        break;
                }

                const fieldHtml = `
                    <div class="form-group">
                        <label class="form-label" for="custom_${field.field_key}">${escapeHtml(field.field_label)} ${requiredLabel}</label>
                        ${inputHtml}
                    </div>
                `;
                area.insertAdjacentHTML('beforeend', fieldHtml);
            });
        }

        function openAddUserModal() {
            isEditMode = false;
            document.getElementById('userModalTitle').textContent = '添加用户';
            document.getElementById('userFormBtn').textContent = '添加';
            document.getElementById('user_id').value = '';
            document.getElementById('user_email').value = '';
            document.getElementById('user_name').value = '';
            document.getElementById('user_username').value = '';
            document.getElementById('user_password').value = '';
            document.getElementById('user_password').required = true;
            document.getElementById('password_hint').textContent = '密码为必填项';
            document.getElementById('user_email').disabled = false;
            document.getElementById('userFormError').textContent = '';
            renderCustomFieldsForm({});
            document.getElementById('userModal').classList.add('active');
        }

        async function openEditUserModal(userId) {
            isEditMode = true;
            document.getElementById('userModalTitle').textContent = '编辑用户';
            document.getElementById('userFormBtn').textContent = '保存';
            document.getElementById('user_password').required = false;
            document.getElementById('password_hint').textContent = '留空则不修改密码';
            document.getElementById('userFormError').textContent = '';

            const user = allUsers.find(u => u.id === userId);
            if (!user) {
                if (typeof ssoUtils !== 'undefined') {
                    ssoUtils.showAlert('用户不存在', 'error');
                } else {
                    alert('用户不存在');
                }
                return;
            }

            try {
                const customDataResponse = await safeApiRequest(`/api/user/${userId}/custom-data`);
                const customData = customDataResponse.custom_data;

                document.getElementById('user_id').value = user.id;
                document.getElementById('user_email').value = user.email;
                document.getElementById('user_email').disabled = true;
                document.getElementById('user_name').value = user.name;
                document.getElementById('user_username').value = user.username || '';
                document.getElementById('user_password').value = '';

                renderCustomFieldsForm(customData);
                document.getElementById('userModal').classList.add('active');

            } catch (error) {
                if (typeof ssoUtils !== 'undefined') {
                    ssoUtils.showAlert('加载用户数据失败: ' + error.message, 'error');
                } else {
                    alert('加载用户数据失败: ' + error.message);
                }
            }
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.remove('active');
            document.getElementById('userForm').reset();
        }

        async function handleUserSubmit(event) {
            event.preventDefault();

            const form = event.target;
            const userId = form.user_id.value;
            const email = form.email.value;
            const name = form.name.value;
            const username = form.username.value || null;
            const password = form.password.value;
            const errorEl = document.getElementById('userFormError');
            errorEl.textContent = '';

            const customData = {};
            customFields.forEach(field => {
                if (!field.show_in_profile) return;

                const input = form.elements[field.field_key];
                if (input) {
                    customData[field.field_key] = input.value;
                }
            });

            try {
                let url, method, body;

                if (isEditMode) {
                    url = `/api/admin/users/${userId}`;
                    method = 'PUT';
                    body = JSON.stringify({
                        name: name,
                        username: username,
                        password: password || undefined,
                        custom_data: customData
                    });
                } else {
                    url = '/api/admin/user';
                    method = 'POST';
                    body = JSON.stringify({
                        email: email,
                        name: name,
                        username: username,
                        password: password,
                        custom_data: customData
                    });
                }

                const data = await safeApiRequest(url, { method, body });

                if (typeof ssoUtils !== 'undefined') {
                    ssoUtils.showAlert(data.message, 'success');
                } else {
                    alert(data.message);
                }

                closeUserModal();
                loadData();

            } catch (error) {
                errorEl.textContent = error.message;
            }
        }

        async function deleteUser(userId, email) {
            const confirmed = typeof ssoUtils !== 'undefined'
                ? await ssoUtils.showConfirm({
                    title: '确认删除用户',
                    message: `确定要删除用户 ${email} (ID: ${userId}) 吗? 此操作不可逆!`,
                    confirmText: '删除',
                    type: 'danger'
                })
                : confirm(`确定要删除用户 ${email} (ID: ${userId}) 吗? 此操作不可逆!`);

            if (!confirmed) return;

            try {
                const data = await safeApiRequest(`/api/admin/users/${userId}`, { method: 'DELETE' });

                if (typeof ssoUtils !== 'undefined') {
                    ssoUtils.showAlert(data.message, 'success');
                } else {
                    alert(data.message);
                }

                loadData();
            } catch (error) {
                if (typeof ssoUtils !== 'undefined') {
                    ssoUtils.showAlert('删除失败: ' + error.message, 'error');
                } else {
                    alert('删除失败: ' + error.message);
                }
            }
        }

        let selectedUserFile = null;

        function openImportUsersModal() {
            document.getElementById('importUsersModal').classList.add('active');
        }

        function closeImportUsersModal() {
            document.getElementById('importUsersModal').classList.remove('active');
            document.getElementById('userFileInput').value = '';
            document.getElementById('userFileInfo').textContent = '';
            document.getElementById('importUsersError').textContent = '';
            document.getElementById('importUsersResult').style.display = 'none';
            document.getElementById('importUsersBtn').disabled = true;
            selectedUserFile = null;
        }

        function handleUserFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedUserFile = file;
                document.getElementById('userFileInfo').textContent = `已选择: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                document.getElementById('importUsersBtn').disabled = false;
            }
        }

        const userUploadArea = document.getElementById('userFileUploadArea');

        userUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            userUploadArea.style.borderColor = 'var(--primary-color)';
        });

        userUploadArea.addEventListener('dragleave', () => {
            userUploadArea.style.borderColor = '';
        });

        userUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            userUploadArea.style.borderColor = '';

            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith('.txt') || file.name.endsWith('.csv'))) {
                selectedUserFile = file;
                document.getElementById('userFileInfo').textContent = `已选择: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                document.getElementById('importUsersBtn').disabled = false;
            } else {
                alert('请选择 .txt 或 .csv 文件');
            }
        });

        async function handleImportUsers() {
            if (!selectedUserFile) return;

            const errorEl = document.getElementById('importUsersError');
            const resultEl = document.getElementById('importUsersResult');
            errorEl.textContent = '';
            resultEl.style.display = 'none';

            try {
                const text = await selectedUserFile.text();
                const lines = text.split(/[\r\n]+/).map(l => l.trim()).filter(l => l);

                if (lines.length === 0) {
                    errorEl.textContent = '文件为空';
                    return;
                }

                const users = [];
                let lineNum = 0;

                for (const line of lines) {
                    lineNum++;
                    if (lineNum === 1 && line.toLowerCase().includes('email') && line.toLowerCase().includes('password')) {
                        continue;
                    }

                    const parts = line.split(',').map(p => p.trim());

                    if (parts.length < 3) {
                        errorEl.textContent = `第 ${lineNum} 行格式错误: 至少需要 email,password,name`;
                        return;
                    }

                    const email = parts[0];
                    const username = parts.length > 3 ? parts[1] : null;
                    const password = parts.length > 3 ? parts[2] : parts[1];
                    const name = parts.length > 3 ? parts[3] : parts[2];

                    users.push({ email, username, password, name });
                }

                if (users.length === 0) {
                    errorEl.textContent = '没有找到有效的用户数据';
                    return;
                }

                const response = await safeApiRequest('/api/admin/users/import', {
                    method: 'POST',
                    body: JSON.stringify({ users })
                });

                if (typeof ssoUtils !== 'undefined') {
                    ssoUtils.showAlert(`导入完成: 成功 ${response.success} 个, 失败 ${response.failed} 个。`, 'success');
                } else {
                    alert(`导入完成: 成功 ${response.success} 个, 失败 ${response.failed} 个。`);
                }

                setTimeout(() => {
                    loadData();
                    closeImportUsersModal();
                }, 1500);

            } catch (error) {
                errorEl.textContent = error.message;
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);

        window.onclick = function(event) {
            const userModal = document.getElementById('userModal');
            const importModal = document.getElementById('importUsersModal');
            if (event.target === userModal) {
                closeUserModal();
            }
            if (event.target === importModal) {
                closeImportUsersModal();
            }
        }
    </script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
