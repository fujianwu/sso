<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>验证码 - {{ settings.SITE_NAME }}</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .code-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .user-email {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .code {
            font-size: 56px;
            font-weight: bold;
            letter-spacing: 12px;
            font-family: 'SF Mono', 'Monaco', monospace;
            color: #fff;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
        }

        .timer {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .timer-circle {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .timer-circle svg {
            transform: rotate(-90deg);
            width: 60px;
            height: 60px;
        }

        .timer-circle circle {
            fill: none;
            stroke-width: 4;
        }

        .timer-circle .bg {
            stroke: rgba(255, 255, 255, 0.1);
        }

        .timer-circle .progress {
            stroke: #6366f1;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }

        .info {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            max-width: 280px;
            line-height: 1.6;
        }

        .countdown-hint {
            margin-top: 30px;
            padding: 12px 24px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="code-display">
        <p class="user-email">{{ user_email }}</p>
        <p class="code" id="code">--- ---</p>

        <div class="timer">
            <div class="timer-circle">
                <svg viewBox="0 0 60 60">
                    <circle class="bg" cx="30" cy="30" r="26"></circle>
                    <circle class="progress" cx="30" cy="30" r="26"
                            stroke-dasharray="163.36"
                            stroke-dashoffset="0"
                            id="timerProgress"></circle>
                </svg>
            </div>
            <span class="timer-text" id="timerText">30s</span>
        </div>
    </div>

    <p class="info">验证码每30秒自动刷新，请在下方输入框输入当前验证码</p>

    <p class="countdown-hint" id="countdownHint">页面将在 <span id="refreshCountdown">5</span> 秒后刷新</p>

    <script>
        const sessionToken = "{{ session_token }}";
        let timeRemaining = 30;

        async function updateCode() {
            try {
                const response = await fetch(`/api/mfa/current-code?session_token=${sessionToken}`);
                if (!response.ok) {
                    window.location.href = '/login';
                    return;
                }
                const data = await response.json();
                document.getElementById('code').textContent = data.code;
                timeRemaining = data.time_remaining;
                updateTimer(timeRemaining);
            } catch (error) {
                console.error('获取验证码失败:', error);
            }
        }

        function updateTimer(seconds) {
            const progressCircle = document.getElementById('timerProgress');
            const timerText = document.getElementById('timerText');

            const circumference = 2 * Math.PI * 26;
            const offset = circumference - (seconds / 30) * circumference;

            progressCircle.style.strokeDashoffset = offset;
            timerText.textContent = `${seconds}s`;

            // 进度条颜色变化
            if (seconds <= 5) {
                progressCircle.style.stroke = '#ef4444';
            } else if (seconds <= 10) {
                progressCircle.style.stroke = '#f59e0b';
            } else {
                progressCircle.style.stroke = '#6366f1';
            }
        }

        // 初始加载
        updateCode();

        // 每秒更新计时器
        setInterval(() => {
            timeRemaining--;
            if (timeRemaining <= 0) {
                updateCode();
            } else {
                updateTimer(timeRemaining);
            }
        }, 1000);

        // 自动刷新页面
        let refreshSeconds = 5;
        const refreshCountdown = document.getElementById('refreshCountdown');
        setInterval(() => {
            refreshSeconds--;
            if (refreshSeconds <= 0) {
                refreshSeconds = 5;
                updateCode();
            }
            refreshCountdown.textContent = refreshSeconds;
        }, 1000);

        // 防止页面休眠
        if ('wakeLock' in navigator) {
            try {
                navigator.wakeLock.request('screen').catch(() => {});
            } catch (e) {}
        }
    </script>
</body>
</html>
