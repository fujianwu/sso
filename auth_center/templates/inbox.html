<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心 — SSO 认证中心</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/modern.css') }}">
    <script src="{{ url_for('static', path='/js/lucide.js') }}"></script>
    <style>
        .inbox-wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 4rem; position:relative;z-index:1; }
        .page-eyebrow { font-family:var(--font-display);font-size:.6rem;letter-spacing:4px;text-transform:uppercase;color:var(--primary-color);margin-bottom:.5rem;opacity:.8; }
        .page-title { font-family:var(--font-display);font-size:1.6rem;font-weight:800;letter-spacing:2px;color:var(--text-primary);margin-bottom:1.5rem; }

        /* Tab 切换 */
        .tab-bar { display:flex;gap:4px;margin-bottom:1.5rem;background:rgba(0,0,0,.3);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:4px;width:fit-content; }
        .tab-btn {
            padding:.5rem 1.25rem;font-size:.8rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
            border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;
            background:transparent;color:var(--text-muted);display:flex;align-items:center;gap:6px;
        }
        .tab-btn i { width:14px;height:14px; }
        .tab-btn.active { background:rgba(0,229,255,.12);color:var(--primary-color);box-shadow:0 0 12px rgba(0,229,255,.1); }
        .tab-panel { display:none; }
        .tab-panel.active { display:block;animation:float-up .25s ease; }

        /* ── 广播列表 ── */
        .broadcast-list { display:flex;flex-direction:column;gap:1rem; }
        .broadcast-card {
            background:rgba(8,15,31,.95);border:1px solid var(--border-color);border-radius:var(--radius-lg);
            padding:1.5rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
        }
        .broadcast-card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent-color),var(--primary-color));opacity:.5; }
        .broadcast-card:hover { border-color:rgba(0,229,255,.25);box-shadow:0 8px 24px rgba(0,229,255,.07); }
        .broadcast-card.expanded .broadcast-body { display:block; }
        .broadcast-header { display:flex;align-items:flex-start;justify-content:space-between;gap:1rem; }
        .broadcast-title-wrap { flex:1; }
        .broadcast-badge { display:inline-flex;align-items:center;gap:4px;font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-color);background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);padding:2px 7px;border-radius:3px;margin-bottom:.5rem; }
        .broadcast-badge i { width:10px;height:10px; }
        .broadcast-title { font-size:1rem;font-weight:700;color:var(--text-primary);margin-bottom:.25rem; }
        .broadcast-meta { font-size:.75rem;color:var(--text-muted);display:flex;gap:.75rem; }
        .broadcast-preview { font-size:.85rem;color:var(--text-muted);margin-top:.5rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; }
        .broadcast-body { display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border-color);font-size:.9rem;color:var(--text-secondary);line-height:1.8;word-break:break-word; }
        .broadcast-html-body { white-space:normal; }
        .broadcast-html-body img { max-width:100%;border-radius:6px;margin:6px 0; }
        .broadcast-html-body a { color:var(--primary-color); }
        .broadcast-html-body ul,.broadcast-html-body ol { padding-left:1.4rem; }
        .broadcast-toggle { color:var(--text-muted);font-size:.75rem;flex-shrink:0;display:flex;align-items:center;gap:4px; }

        /* ── 对话列表 ── */
        .conv-layout { display:grid;grid-template-columns:280px 1fr;gap:1rem;height:600px; }
        .conv-list-panel { background:rgba(8,15,31,.95);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column; }
        .conv-list-head { padding:.875rem 1rem;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between; }
        .conv-list-title { font-family:var(--font-display);font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--primary-color); }
        .conv-list-scroll { flex:1;overflow-y:auto; }
        .conv-list-scroll::-webkit-scrollbar { width:3px; }
        .conv-list-scroll::-webkit-scrollbar-thumb { background:var(--border-color);border-radius:2px; }

        .conv-item {
            padding:.875rem 1rem;border-bottom:1px solid rgba(0,229,255,.05);cursor:pointer;transition:all .15s;
        }
        .conv-item:hover { background:rgba(0,229,255,.04); }
        .conv-item.active { background:rgba(0,229,255,.08);border-left:3px solid var(--primary-color);padding-left:calc(1rem - 3px); }
        .conv-item-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:.25rem; }
        .conv-item-subject { font-size:.85rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px; }
        .conv-item-time { font-size:.68rem;color:var(--text-muted);flex-shrink:0; }
        .conv-item-preview { font-size:.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .conv-item-badges { display:flex;align-items:center;gap:.4rem;margin-top:.3rem; }
        .unread-dot { width:7px;height:7px;border-radius:50%;background:var(--primary-color);box-shadow:0 0 6px var(--primary-color);flex-shrink:0; }
        .closed-tag { font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);background:rgba(255,255,255,.05);border:1px solid var(--border-color);padding:1px 5px;border-radius:3px; }

        /* ── 聊天窗口 ── */
        .chat-panel { background:rgba(8,15,31,.95);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column; }
        .chat-empty { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:.75rem; }
        .chat-empty i { width:40px;height:40px;opacity:.3; }

        .chat-head { padding:.875rem 1.25rem;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:.75rem;flex-shrink:0; }
        .chat-head-icon { width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary-color),var(--accent-color));display:flex;align-items:center;justify-content:center; }
        .chat-head-icon i { width:15px;height:15px;color:#000; }
        .chat-head-info { flex:1; }
        .chat-head-name { font-size:.875rem;font-weight:700;color:var(--text-primary); }
        .chat-head-sub { font-size:.72rem;color:var(--text-muted); }
        .chat-status-closed { font-size:.68rem;color:var(--warning-color);background:rgba(255,215,64,.08);border:1px solid rgba(255,215,64,.2);padding:2px 7px;border-radius:3px; }

        .chat-messages { flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem; }
        .chat-messages::-webkit-scrollbar { width:3px; }
        .chat-messages::-webkit-scrollbar-thumb { background:var(--border-color);border-radius:2px; }

        /* ── 聊天气泡 ── */
        .msg-bubble-wrap { display:flex; align-items:flex-end; gap:8px; margin-bottom:2px; }
        .msg-bubble-wrap.mine { flex-direction:row-reverse; }
        .bubble-avatar {
            width:30px; height:30px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            flex-shrink:0; font-size:.72rem; font-weight:800;
            box-shadow:0 2px 6px rgba(0,0,0,.4);
        }
        .bubble-avatar.admin {
            background:linear-gradient(135deg,var(--primary-color),var(--accent-color));
            color:#000;
        }
        .bubble-avatar.user {
            background:rgba(255,255,255,.1);
            border:1px solid rgba(255,255,255,.15);
            color:var(--text-secondary);
        }
        .bubble-col { display:flex; flex-direction:column; max-width:68%; }
        .mine .bubble-col { align-items:flex-end; }
        .bubble {
            padding:.55rem .875rem;
            font-size:.875rem; line-height:1.65;
            word-break:break-word;
            position:relative;
        }
        /* 对方（管理员）气泡：左对齐，深色背景 */
        .bubble.admin {
            background:#1a2640;
            color:#ddeeff;
            border-radius:4px 16px 16px 16px;
            box-shadow:0 1px 4px rgba(0,0,0,.35);
        }
        /* 自己（用户）气泡：右对齐，青色 */
        .bubble.mine {
            background:linear-gradient(135deg,#00b4cc,#0091a8);
            color:#fff;
            border-radius:16px 4px 16px 16px;
            box-shadow:0 2px 8px rgba(0,180,204,.25);
        }
        .bubble-meta {
            display:flex; align-items:center; gap:6px;
            margin-top:3px; padding:0 2px;
        }
        .mine .bubble-meta { flex-direction:row-reverse; }
        .bubble-time { font-size:.62rem; color:var(--text-muted); white-space:nowrap; }
        .retract-btn {
            display:none; background:none; border:none;
            color:var(--text-muted); cursor:pointer; font-size:.65rem;
            padding:1px 5px; border-radius:3px; transition:all .15s;
            white-space:nowrap;
        }
        .retract-btn:hover { color:var(--danger-color); background:rgba(255,23,68,.1); }
        .msg-bubble-wrap:hover .retract-btn { display:inline-flex; align-items:center; gap:3px; }

        .chat-input-area { border-top:1px solid var(--border-color);padding:.875rem;flex-shrink:0; }
        .chat-input-row { display:flex;gap:.5rem;align-items:flex-end; }
        .chat-textarea {
            flex:1;padding:.625rem .875rem;background:rgba(0,0,0,.35);border:1px solid var(--border-color);
            border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-family);font-size:.875rem;
            resize:none;min-height:40px;max-height:120px;outline:none;transition:border-color .2s;line-height:1.5;
        }
        .chat-textarea:focus { border-color:var(--primary-color); }
        .chat-send-btn {
            width:40px;height:40px;border-radius:var(--radius-md);background:var(--primary-color);
            border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
            transition:all .2s;flex-shrink:0;
        }
        .chat-send-btn:hover { box-shadow:0 0 16px rgba(0,229,255,.4);transform:scale(1.05); }
        .chat-send-btn:disabled { opacity:.4;cursor:not-allowed;transform:none; }
        .chat-send-btn i { width:16px;height:16px;color:#000; }
        .chat-closed-notice { text-align:center;padding:.75rem;font-size:.78rem;color:var(--text-muted);background:rgba(255,215,64,.05);border-top:1px solid rgba(255,215,64,.1); }

        /* 微信风格发送状态 */
        .msg-status { display:flex;align-items:center;flex-shrink:0;margin-bottom:2px; }
        .msg-status-spinner {
            width:16px;height:16px;border:2px solid rgba(255,255,255,.25);
            border-top-color:var(--primary-color);border-radius:50%;
            animation:spin .7s linear infinite;
        }
        .msg-status-fail {
            width:18px;height:18px;border-radius:50%;background:var(--danger-color,#ff1744);
            color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
            cursor:pointer;flex-shrink:0;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* 新建对话按钮 */
        .new-conv-btn {
            display:flex;align-items:center;gap:6px;padding:.45rem .75rem;
            font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
            background:var(--primary-color);color:#000;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;
        }
        .new-conv-btn:hover { box-shadow:0 0 16px rgba(0,229,255,.3); }
        .new-conv-btn i { width:12px;height:12px; }

        /* 新建对话弹窗 */
        .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px); }
        .modal-overlay.open { display:flex; }
        .modal-box { background:rgba(10,18,36,.98);border:1px solid var(--border-color);border-radius:var(--radius-xl);width:480px;max-width:92vw;animation:float-up .25s ease;overflow:hidden; }
        .modal-box::before { content:'';display:block;height:2px;background:linear-gradient(90deg,var(--primary-color),var(--accent-color)); }
        .modal-head { padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between; }
        .modal-title { font-family:var(--font-display);font-size:.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-primary); }
        .modal-close { background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px; }
        .modal-close:hover { color:var(--danger-color); }
        .modal-body { padding:1.5rem;display:flex;flex-direction:column;gap:1rem; }
        .modal-input { width:100%;padding:.65rem .875rem;background:rgba(0,0,0,.35);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.875rem;outline:none;font-family:var(--font-family);transition:border-color .2s; }
        .modal-input:focus { border-color:var(--primary-color); }
        .modal-textarea { min-height:100px;resize:vertical;line-height:1.6; }
        .modal-label { font-size:.72rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:.35rem;display:block; }
        .modal-footer { padding:1rem 1.5rem;border-top:1px solid var(--border-color);display:flex;justify-content:flex-end;gap:.5rem; }

        @media(max-width:700px){ .conv-layout{grid-template-columns:1fr;height:auto;} .conv-list-panel{max-height:220px;} .chat-panel{min-height:400px;} }
        .conv-del-btn {
            display:none; background:none; border:none; color:var(--text-muted);
            cursor:pointer; padding:2px; border-radius:3px; transition:color .15s;
        }
        .conv-del-btn i { width:12px; height:12px; }
        .conv-del-btn:hover { color:var(--danger-color); }
        .conv-item:hover .conv-del-btn { display:flex; align-items:center; }
        .img-upload-btn { width:36px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;flex-shrink:0;border-radius:var(--radius-sm);transition:color .2s; }
        .img-upload-btn:hover { color:var(--primary-color); }
        .img-upload-btn i { width:18px;height:18px; }
        .img-preview-item { position:relative;display:inline-block;margin-right:.5rem; }
        .img-preview-item img { width:60px;height:60px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border-color); }
        .img-preview-item .rm-btn { position:absolute;top:-6px;right:-6px;background:var(--danger-color);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1; }
        .chat-img { max-width:200px;max-height:180px;border-radius:var(--radius-md);cursor:pointer;display:block;margin-top:4px;border:1px solid rgba(0,229,255,.2); }
        .retract-msg { font-style:italic;color:var(--text-muted);font-size:.8rem; }

    </style>
</head>
<body>
    {% include "header.html" %}
    <div class="inbox-wrap">
        <div class="page-eyebrow">Messages</div>
        <div class="page-title">消息中心</div>

        <div class="tab-bar">
            <button class="tab-btn active" id="tabBroadcast" onclick="switchTab('broadcast')">
                <i data-lucide="megaphone"></i>公告
            </button>
            <button class="tab-btn" id="tabConv" onclick="switchTab('conv')">
                <i data-lucide="message-circle"></i>对话
                <span id="convUnreadBadge" style="display:none;background:var(--primary-color);color:#000;border-radius:50%;font-size:.65rem;font-weight:800;padding:0 5px;min-width:16px;text-align:center;"></span>
            </button>
        </div>

        <!-- 广播 Tab -->
        <div class="tab-panel active" id="panelBroadcast">
            <div id="broadcastList" class="broadcast-list">
                <div style="text-align:center;padding:2rem;color:var(--text-muted);"><i data-lucide="loader-2" style="animation:spin 1s linear infinite;width:24px;height:24px;display:inline-block;"></i></div>
            </div>
        </div>

        <!-- 对话 Tab -->
        <div class="tab-panel" id="panelConv">
            <div class="conv-layout">
                <div class="conv-list-panel">
                    <div class="conv-list-head">
                        <span class="conv-list-title">我的对话</span>
                        <button class="new-conv-btn" onclick="openNewConvModal()">
                            <i data-lucide="plus"></i>新建
                        </button>
                    </div>
                    <div class="conv-list-scroll" id="convList">
                        <div style="padding:1.5rem;text-align:center;color:var(--text-muted);font-size:.85rem;">加载中…</div>
                    </div>
                </div>
                <div class="chat-panel" id="chatPanel">
                    <div class="chat-empty" id="chatEmpty">
                        <i data-lucide="message-square-dashed"></i>
                        <p style="font-size:.875rem;">选择一个对话开始聊天</p>
                        <button class="new-conv-btn" onclick="openNewConvModal()" style="margin-top:.5rem;">
                            <i data-lucide="plus"></i>发起新对话
                        </button>
                    </div>
                    <div id="chatContent" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
                        <div class="chat-head" id="chatHead"></div>
                        <div class="chat-messages" id="chatMessages"></div>
                        <div id="chatInputArea" class="chat-input-area">
                            <div id="imgPreviewBar" style="display:none;padding:.5rem .875rem 0;"></div>
                            <div class="chat-input-row">
                                <label class="img-upload-btn" title="发送图片">
                                    <i data-lucide="image"></i>
                                    <input type="file" accept="image/*" style="display:none;" id="userImgInput" onchange="handleImgSelect(this)">
                                </label>
                                <textarea class="chat-textarea" id="chatInput" placeholder="输入消息…" rows="1"
                                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
                                <button class="chat-send-btn" onclick="sendMsg()" id="sendBtn"><i data-lucide="send"></i></button>
                            </div>
                        </div>
                        <div id="chatClosedNotice" class="chat-closed-notice" style="display:none;">此对话已关闭，无法继续发送消息</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新建对话弹窗 -->
    <div class="modal-overlay" id="newConvModal" onclick="if(event.target===this)closeNewConvModal()">
        <div class="modal-box">
            <div class="modal-head">
                <span class="modal-title">发起新对话</span>
                <button class="modal-close" onclick="closeNewConvModal()"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div>
                    <label class="modal-label">主题</label>
                    <input class="modal-input" id="newConvSubject" type="text" placeholder="简要描述你的问题…" maxlength="100">
                </div>
                <div>
                    <label class="modal-label">消息内容</label>
                    <textarea class="modal-input modal-textarea" id="newConvBody" placeholder="详细描述…"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost btn-sm" onclick="closeNewConvModal()">取消</button>
                <button class="btn btn-primary btn-sm" onclick="createConversation()" id="createConvBtn">
                    <i data-lucide="send"></i><span>发送</span>
                </button>
            </div>
        </div>
    </div>

    {% include "footer.html" %}
    <script>
    lucide.createIcons();

    let currentConvId = null;
    let conversations = [];
    let pollTimer = null;

    // ── Tab 切换 ──
    function switchTab(tab){
        document.getElementById('panelBroadcast').classList.toggle('active', tab==='broadcast');
        document.getElementById('panelConv').classList.toggle('active', tab==='conv');
        document.getElementById('tabBroadcast').classList.toggle('active', tab==='broadcast');
        document.getElementById('tabConv').classList.toggle('active', tab==='conv');
        if(tab==='broadcast') loadBroadcasts();
        if(tab==='conv') loadConversations();
    }

    // ── Toast ──
    function toast(msg, type='ok'){
        let box=document.getElementById('_tb');
        if(!box){box=document.createElement('div');box.id='_tb';box.style='position:fixed;top:70px;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;';document.body.appendChild(box);}
        const el=document.createElement('div');
        el.style=`padding:.7rem 1rem;background:rgba(8,15,31,.97);border-radius:8px;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:8px;border-left:3px solid;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:all;border-color:${type==='ok'?'var(--success-color)':'var(--danger-color)'};color:${type==='ok'?'#4cffaa':'#ff6b8a'};`;
        el.textContent=msg;box.appendChild(el);
        setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3500);
    }

    // ── 广播 ──
    async function loadBroadcasts(){
        try{
            const r=await fetch('/api/broadcasts',{credentials:'include'});
            const d=await r.json();
            const list=document.getElementById('broadcastList');
            if(!d.broadcasts?.length){
                list.innerHTML='<div style="text-align:center;padding:3rem;color:var(--text-muted);"><i data-lucide="megaphone" style="width:36px;height:36px;display:block;margin:0 auto .75rem;opacity:.3;"></i><p>暂无公告</p></div>';
                lucide.createIcons();return;
            }
            list.innerHTML=d.broadcasts.map(b=>`
                <div class="broadcast-card" onclick="toggleBroadcast(this)">
                    <div class="broadcast-header">
                        <div class="broadcast-title-wrap">
                            <div class="broadcast-badge"><i data-lucide="megaphone"></i>系统公告</div>
                            <div class="broadcast-title">${escHtml(b.title)}</div>
                            <div class="broadcast-meta">
                                <span>${b.admin_name||'管理员'}</span>
                                <span>${fmtTime(b.created_at)}</span>
                            </div>
                            <div class="broadcast-preview">${escHtml(b.body.replace(/<[^>]+>/g,''))}</div>
                        </div>
                        <div class="broadcast-toggle"><i data-lucide="chevron-down"></i></div>
                    </div>
                    <div class="broadcast-body broadcast-html-body">${b.body}</div>
                </div>`).join('');
            lucide.createIcons();
        }catch{document.getElementById('broadcastList').innerHTML='<div style="padding:2rem;text-align:center;color:var(--text-muted);">加载失败</div>';}
    }

    function toggleBroadcast(el){
        el.classList.toggle('expanded');
        const icon=el.querySelector('.broadcast-toggle i');
        if(icon) icon.setAttribute('data-lucide', el.classList.contains('expanded')?'chevron-up':'chevron-down');
        lucide.createIcons();
    }

    // ── 对话列表 ──
    async function loadConversations(){
        try{
            const r=await fetch('/api/conversations',{credentials:'include'});
            const d=await r.json();
            conversations=d.conversations||[];
            renderConvList();
            // 更新未读 badge
            const total=conversations.reduce((s,c)=>s+(c.unread||0),0);
            const badge=document.getElementById('convUnreadBadge');
            if(total>0){badge.textContent=total>9?'9+':total;badge.style.display='inline-block';}
            else badge.style.display='none';
        }catch{}
    }

    function renderConvList(){
        const el=document.getElementById('convList');
        if(!conversations.length){
            el.innerHTML='<div style="padding:1.5rem;text-align:center;color:var(--text-muted);font-size:.825rem;">暂无对话</div>';
            return;
        }
        el.innerHTML=conversations.map(c=>`
            <div class="conv-item${currentConvId===c.id?' active':''}" onclick="openConv(${c.id})">
                <div class="conv-item-header">
                    <span class="conv-item-subject">${escHtml(c.subject)}</span>
                    <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
                        <span class="conv-item-time">${fmtTime(c.updated_at)}</span>
                        <button class="conv-del-btn" title="删除对话（仅自己不可见）"
                            onclick="event.stopPropagation();deleteConv(${c.id})">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                </div>
                <div class="conv-item-preview">${escHtml(c.last_msg||'')}</div>
                <div class="conv-item-badges">
                    ${c.unread>0?'<div class="unread-dot"></div>':''}
                    ${c.status==='closed'?'<span class="closed-tag">已关闭</span>':''}
                </div>
            </div>`).join('');
        lucide.createIcons();
    }

    // ── 打开对话 ──
    async function openConv(cid){
        currentConvId=cid;
        renderConvList();
        const conv=conversations.find(c=>c.id===cid);
        if(!conv) return;
        // 显示聊天区
        document.getElementById('chatEmpty').style.display='none';
        const cc=document.getElementById('chatContent');
        cc.style.display='flex';
        // 头部
        document.getElementById('chatHead').innerHTML=`
            <div class="chat-head-icon"><i data-lucide="user-circle"></i></div>
            <div class="chat-head-info">
                <div class="chat-head-name">${escHtml(conv.subject)}</div>
                <div class="chat-head-sub">与管理员的对话</div>
            </div>
            ${conv.status==='closed'?'<span class="chat-status-closed">已关闭</span>':''}`;
        // 输入区
        const inputArea=document.getElementById('chatInputArea');
        const closedNotice=document.getElementById('chatClosedNotice');
        if(conv.status==='closed'){inputArea.style.display='none';closedNotice.style.display='block';}
        else{inputArea.style.display='block';closedNotice.style.display='none';}
        lucide.createIcons();
        // 加载消息
        await loadMessages(cid);
        // 清未读
        conv.unread=0;
        renderConvList();
        // 启动轮询
        clearInterval(pollTimer);
        if(conv.status!=='closed') pollTimer=setInterval(()=>loadMessages(cid,true),8000);
    }

    async function loadMessages(cid, silent=false){
        try{
            const r=await fetch(`/api/conversations/${cid}/messages`,{credentials:'include'});
            const d=await r.json();
            if(!d.success) return;
            renderMessages(d.messages);
        }catch{}
    }

    function renderBody(body){
        if(body==='[已撤回]') return `<span class="retract-msg">消息已撤回</span>`;
        const parts = body.split(/\[IMG\]([\s\S]*?)\[\/IMG\]/);
        return parts.map((p, i) => {
            if(i % 2 === 1) return `<img class="chat-img" src="${p}" onclick="window.open(this.src)" loading="lazy">`;
            return escHtml(p).replace(/\n/g,'<br>');
        }).join('');
    }

    function renderMessages(msgs){
        const el=document.getElementById('chatMessages');
        if(!msgs.length){
            el.innerHTML='<div style="text-align:center;color:var(--text-muted);font-size:.825rem;padding:2rem;">发送第一条消息开始对话</div>';
            return;
        }
        const wasAtBottom=el.scrollHeight-el.scrollTop-el.clientHeight<60;
        el.innerHTML=msgs.map(m=>{
            const isAdmin = m.sender_role==='admin';
            const cls = isAdmin ? 'admin' : 'mine';
            const isRetracted = m.body==='[已撤回]';
            // 用户只能撤回自己发的（user role），不能撤管理员的
            const canRetract = !isAdmin && !isRetracted;
            const avatar = isAdmin ? '客服' : (m.sender_name?.charAt(0)||'我').toUpperCase();
            return `<div class="msg-bubble-wrap ${isAdmin?'':'mine'}">
                <div class="bubble-avatar ${cls}">${avatar}</div>
                <div class="bubble-col">
                    <div class="bubble ${cls}">${renderBody(m.body)}</div>
                    <div class="bubble-meta">
                        <span class="bubble-time">${fmtTime(m.created_at)}</span>
                        ${canRetract
                            ? `<button class="retract-btn" onclick="retractMsg(${currentConvId},${m.id})">撤回</button>`
                            : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
        if(wasAtBottom||msgs.length<3) el.scrollTop=el.scrollHeight;
    }

    let pendingImg = null;

    function handleImgSelect(input){
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            pendingImg = {file, dataUrl: e.target.result};
            const bar = document.getElementById('imgPreviewBar');
            bar.style.display='block';
            bar.innerHTML=`<div class="img-preview-item"><img src="${e.target.result}"><button class="rm-btn" onclick="clearImg()">×</button></div>`;
            lucide.createIcons();
        };
        reader.readAsDataURL(file);
        input.value='';
    }
    function clearImg(){ pendingImg=null; const b=document.getElementById('imgPreviewBar'); b.style.display='none'; b.innerHTML=''; }

    async function sendMsg(){
        const input=document.getElementById('chatInput');
        const text=input.value.trim();
        if(!text && !pendingImg) return;
        if(!currentConvId) return;

        let body = text;
        if(pendingImg){
            body = (text ? text+'\n' : '') + '[IMG]'+pendingImg.dataUrl+'[/IMG]';
            clearImg();
        }
        input.value='';

        const tempId='tmp_'+Date.now();
        const msgEl=document.getElementById('chatMessages');
        const isAtBottom=msgEl.scrollHeight-msgEl.scrollTop-msgEl.clientHeight<80;
        const wrap=document.createElement('div');
        wrap.className='msg-bubble-wrap mine';
        wrap.id=tempId;
        wrap.dataset.pendingBody=body;

        // 修复气泡消失问题：使用与正式消息一致的 HTML 结构，包括头像
        const myName = (conversations.find(c=>c.id===currentConvId)?.sender_name?.charAt(0) || '我').toUpperCase();
        wrap.innerHTML=`
            <div class="bubble-avatar mine">${myName}</div>
            <div class="bubble-col">
                <div class="bubble mine">${renderBody(body)}</div>
                <div class="bubble-meta">
                    <span class="bubble-time">发送中...</span>
                    <div class="msg-status" id="${tempId}_status" style="margin-left:5px;">
                        <div class="msg-status-spinner"></div>
                    </div>
                </div>
            </div>`;

        msgEl.appendChild(wrap);
        if(isAtBottom) msgEl.scrollTop=msgEl.scrollHeight;

        await _doSend(tempId, body);
    }

    async function _doSend(tempId, body){
        try{
            const r=await fetch(`/api/conversations/${currentConvId}/messages`,{
                method:'POST',credentials:'include',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({body})
            });
            const d=await r.json();
            if(r.ok && d.success){
                // 发送成功：立即刷新消息列表，确保临时气泡被正式气泡替换
                await loadMessages(currentConvId);
                document.getElementById(tempId)?.remove();
            } else {
                _markFailed(tempId, d.detail || '发送失败');
            }
        }catch(e){
            _markFailed(tempId, '网络错误');
        }
    }

    function _markFailed(tempId, reason){
        const st=document.getElementById(tempId+'_status');
        if(!st) return;

        // 更新状态文字
        const wrap = document.getElementById(tempId);
        if(wrap) {
            const timeEl = wrap.querySelector('.bubble-time');
            if(timeEl) timeEl.textContent = '发送失败';
        }

        const btn=document.createElement('div');
        btn.className='msg-status-fail';
        btn.title = reason + '，点击重试';
        btn.textContent='!';
        btn.onclick=()=>retryMsg(tempId);
        st.innerHTML='';
        st.appendChild(btn);

        // 弹出错误提示
        toast(reason, 'err');
    }

    async function retryMsg(tempId){
        const wrap=document.getElementById(tempId);
        if(!wrap) return;
        const body=wrap.dataset.pendingBody;
        const st=document.getElementById(tempId+'_status');
        if(st){ st.innerHTML='<div class="msg-status-spinner"></div>'; }
        await _doSend(tempId, body);
    }

    async function retractMsg(cid, mid){
        if(!confirm('确定撤回此消息？'))return;
        const r=await fetch(`/api/conversations/${cid}/messages/${mid}`,{method:'DELETE',credentials:'include'});
        if(r.ok) await loadMessages(cid);
        else toast('撤回失败','err');
    }

    // ── 新建对话 ──
    function openNewConvModal(subject='', body=''){
        document.getElementById('newConvSubject').value=subject;
        document.getElementById('newConvBody').value=body;
        document.getElementById('newConvModal').classList.add('open');
        setTimeout(()=>document.getElementById('newConvSubject').focus(),50);
        lucide.createIcons();
    }
    function closeNewConvModal(){ document.getElementById('newConvModal').classList.remove('open'); }

    async function createConversation(){
        const subject=document.getElementById('newConvSubject').value.trim()||'新咨询';
        const body=document.getElementById('newConvBody').value.trim();
        if(!body){toast('请填写消息内容','err');return;}
        const btn=document.getElementById('createConvBtn');
        btn.disabled=true;
        try{
            const r=await fetch('/api/conversations',{
                method:'POST',credentials:'include',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({subject,body})
            });
            const d=await r.json();
            if(r.ok){
                closeNewConvModal();
                switchTab('conv');
                await loadConversations();
                openConv(d.conversation_id);
                toast('对话已创建');
            } else toast(d.detail||'创建失败','err');
        }catch{toast('网络错误','err');}
        finally{btn.disabled=false;}
    }

    // ── 工具函数 ──
    async function deleteConv(cid){
        if(!confirm('确定删除这个对话？\n\n仅从你的列表中移除，管理员仍可看到对话记录。')) return;
        const r = await fetch(`/api/conversations/${cid}`, {method:'DELETE', credentials:'include'});
        if(r.ok){
            conversations = conversations.filter(c=>c.id!==cid);
            renderConvList();
            if(currentConvId===cid){
                currentConvId=null;
                document.getElementById('chatEmpty').style.display='';
                document.getElementById('chatContent').style.display='none';
                clearInterval(pollTimer);
            }
            toast('对话已删除');
        } else toast('删除失败','err');
    }

    function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtTime(s){
        if(!s) return '';
        const d=new Date(s.includes('T')?s:s.replace(' ','T')+'Z');
        const now=new Date(), diff=(now-d)/1000;
        if(diff<60) return '刚刚';
        if(diff<3600) return Math.floor(diff/60)+'分钟前';
        if(diff<86400) return Math.floor(diff/3600)+'小时前';
        return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    }

    // 初始加载
    loadBroadcasts();
    loadConversations();
    </script>
</body>
</html>
